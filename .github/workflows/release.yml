name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test updater
        shell: pwsh
        run: |
          dotnet run --project tests/Castino.UpdateTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed.' }
          ./tests/Test-UpdateInstaller.ps1
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { '' }
          ./scripts/New-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: Castino-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view '${{ github.ref_name }}' --json isDraft --jq .isDraft 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $draft -eq 'false') {
            Write-Output 'Release already published; leaving its verified assets unchanged.'
            exit 0
          }
          if (-not $exists) {
            gh release create '${{ github.ref_name }}' --title 'Castino ${{ github.ref_name }}' --generate-notes --draft
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload '${{ github.ref_name }}' dist/*.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit '${{ github.ref_name }}' --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
